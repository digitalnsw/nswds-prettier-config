name: CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  smoke:
    name: Config smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm clean-install

      # Asserts the options object is valid Prettier config and actually formats
      # code the way the fleet expects.
      - name: Assert the config is valid and formats as expected
        run: npm test
